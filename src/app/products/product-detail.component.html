<ActionBar [title]="product()?.name || 'Szczegóły Produktu'" class="action-bar">
  <NavigationButton text="Wstecz" android.systemIcon="ic_menu_back"></NavigationButton>
</ActionBar>

<ScrollView>
  <StackLayout class="page">
    <!-- Loading indicator -->
    <ActivityIndicator *ngIf="isLoading()" busy="true" class="loading"></ActivityIndicator>

    <!-- Error message -->
    <Label
      *ngIf="error() && !isLoading()"
      [text]="error()"
      class="error-message"
      textWrap="true"
    ></Label>

    <!-- Product details -->
    <StackLayout *ngIf="product() && !isLoading()" class="product-detail">
      <!-- Product Image -->
      <Image
        *ngIf="product()!.imageUrl"
        [src]="getImageSource(product()!.imageUrl)"
        class="product-image"
        stretch="aspectFit"
      ></Image>
      <Label
        *ngIf="!product()!.imageUrl"
        text="📷 Brak zdjęcia"
        class="no-image"
        textWrap="true"
      ></Label>

      <!-- Product Info -->
      <StackLayout class="product-info-section">
        <Label [text]="product()!.name" class="product-title"></Label>
        <Label [text]="'Kod: ' + product()!.code" class="product-code"></Label>
        <Label
          [text]="getStatusText(product()!.status)"
          [backgroundColor]="getStatusColor(product()!.status)"
          class="status-badge-large"
        ></Label>
        <Label
          [text]="product()!.description || 'Brak opisu'"
          class="product-description"
          textWrap="true"
        ></Label>
      </StackLayout>

      <!-- Action buttons -->
      <StackLayout class="actions-section">
        <Button
          text="✏️ Edytuj"
          (tap)="editProduct()"
          class="btn btn-primary"
        ></Button>
        <Button
          text="🗑️ Usuń"
          (tap)="deleteProduct()"
          class="btn btn-danger"
        ></Button>
      </StackLayout>
    </StackLayout>
  </StackLayout>
</ScrollView>
