<ActionBar title="Edytuj Produkt" class="action-bar">
  <NavigationButton text="Wstecz" android.systemIcon="ic_menu_back"></NavigationButton>
</ActionBar>

<ScrollView>
  <StackLayout class="page form-container">
    <!-- Loading indicator -->
    <ActivityIndicator *ngIf="isLoading()" busy="true" class="loading"></ActivityIndicator>

    <!-- Error message -->
    <Label
      *ngIf="error()"
      [text]="error()"
      class="error-message"
      textWrap="true"
    ></Label>

    <!-- Form fields -->
    <StackLayout>
      <!-- Product Image -->
      <StackLayout class="image-section">
        <Image
          *ngIf="imageBase64()"
          [src]="'data:image/jpeg;base64,' + imageBase64()"
          class="preview-image"
          stretch="aspectFit"
        ></Image>
        <Label
          *ngIf="!imageBase64()"
          text="📷 Brak zdjęcia"
          class="no-image"
          textWrap="true"
        ></Label>
        <Button
          text="📷 Zrób Zdjęcie"
          (tap)="takePhoto()"
          class="btn btn-secondary"
        ></Button>
      </StackLayout>

      <!-- Name field -->
      <StackLayout class="form-field">
        <Label text="Nazwa produktu *" class="form-label"></Label>
        <TextField
          [text]="name()"
          (textChange)="onNameChange($event.value)"
          hint="Wprowadź nazwę produktu"
          class="form-input"
          [class.error]="nameError()"
        ></TextField>
        <Label
          *ngIf="nameError()"
          [text]="nameError()"
          class="error-text"
        ></Label>
      </StackLayout>

      <!-- Code field -->
      <StackLayout class="form-field">
        <Label text="Kod produktu *" class="form-label"></Label>
        <TextField
          [text]="code()"
          (textChange)="onCodeChange($event.value)"
          hint="Wprowadź kod produktu"
          class="form-input"
          [class.error]="codeError()"
        ></TextField>
        <Label
          *ngIf="codeError()"
          [text]="codeError()"
          class="error-text"
        ></Label>
      </StackLayout>

      <!-- Description field -->
      <StackLayout class="form-field">
        <Label text="Opis produktu" class="form-label"></Label>
        <TextView
          [text]="description()"
          (textChange)="onDescriptionChange($event.value)"
          hint="Wprowadź opis produktu"
          class="form-textarea"
        ></TextView>
      </StackLayout>

      <!-- Status field -->
      <StackLayout class="form-field">
        <Label text="Status *" class="form-label"></Label>
        <SegmentedBar
          [selectedIndex]="getStatusIndex()"
          (selectedIndexChange)="onStatusChange($event)"
          class="form-segmented"
        >
          <SegmentedBarItem title="Dostępny"></SegmentedBarItem>
          <SegmentedBarItem title="Brak"></SegmentedBarItem>
          <SegmentedBarItem title="Wycofany"></SegmentedBarItem>
        </SegmentedBar>
        <Label
          *ngIf="statusError()"
          [text]="statusError()"
          class="error-text"
        ></Label>
      </StackLayout>

      <!-- Submit button -->
      <Button
        text="Zapisz Zmiany"
        (tap)="onSubmit()"
        [isEnabled]="!isLoading()"
        class="btn btn-primary btn-large"
      ></Button>
    </StackLayout>
  </StackLayout>
</ScrollView>
